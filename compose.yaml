name: geovision
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    MONGO_URI: ${MONGO_DOCKER_URI:-mongodb://mongo:27017}
    SMTP_HOST: mailpit
    DATA_DIR: /app/data
  volumes:
    - geovision_data:/app/data
  depends_on:
    mongo:
      condition: service_healthy
    mailpit:
      condition: service_started
  restart: unless-stopped
services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    <<: *backend
    command: ["python", "-m", "backend.app.worker"]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  mongo_data:
  geovision_data:
