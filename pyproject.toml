[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "models/tests"]
markers = ["integration: requires a running MongoDB instance"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
omit = ["*/tests/*"]
